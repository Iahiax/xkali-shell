; supervisord.conf for xkali-shell on segfault
; Place this file under /sec/xkali-shell/config/supervisord.conf

[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/sec/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ---------- Node.js bot ----------
[program:node-bot]
command=node index.js
directory=/sec/bots/node-bot
autostart=true
autorestart=true
startretries=10
stdout_logfile=/sec/logs/node-bot.log
stderr_logfile=/sec/logs/node-bot.err
user=root
environment=HOME="/sec",NODE_ENV="production"

; ---------- Python bot ----------
[program:python-bot]
command=python3 main.py
directory=/sec/bots/python-bot
autostart=true
autorestart=true
startretries=10
stdout_logfile=/sec/logs/python-bot.log
stderr_logfile=/sec/logs/python-bot.err
user=root
environment=HOME="/sec",PYTHONPATH="/sec/usr"

; ---------- sf-keeper ----------
[program:sf-keeper]
command=bash /sec/xkali-shell/config/sf-keeper.sh
directory=/sec
autostart=true
autorestart=true
startretries=5
stdout_logfile=/sec/logs/sf-keeper.log
stderr_logfile=/sec/logs/sf-keeper.err
user=root
