version: 1.0.{build}

# AppVeyor does not have a native Kali image.
# The CI runner stays Ubuntu; the remote segfault session is already Kali.
image: Ubuntu2204

environment:
  # DO NOT put the real SECRET here in plaintext.
  # Encrypt it in AppVeyor UI → Environment → Add variable → Encrypt
  SEGFault_SECRET:
    secure: # <-- paste AppVeyor encrypted value here
  SEGFault_HOST: lsd.segfault.net

install:
  - sudo apt-get update -qq
  - sudo apt-get install -y -qq openssh-client sshpass expect tmux git curl

build_script:
  - chmod +x scripts/*.sh tmux-sessions/*.sh config/*.sh || true
  - bash scripts/connect-and-revive.sh
  - bash scripts/backup-and-push.sh || true
